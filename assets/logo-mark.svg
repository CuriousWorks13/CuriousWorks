<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Curious Works logo mark">
  <defs>
    <linearGradient id="cwRing" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8fe0ff"/>
      <stop offset="55%" stop-color="#3aa8ff"/>
      <stop offset="100%" stop-color="#1c6fd4"/>
    </linearGradient>
    <radialGradient id="cwDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f8ff"/>
      <stop offset="60%" stop-color="#7fd8ff"/>
      <stop offset="100%" stop-color="#3aa8ff"/>
    </radialGradient>
    <filter id="cwGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="34" stroke="url(#cwRing)" stroke-width="8" stroke-linecap="round"
    stroke-dasharray="160 53.5" transform="rotate(-38 50 50)"/>

  <circle cx="50" cy="50" r="10" fill="url(#cwDot)" opacity="0.9"/>

  <circle cx="78.5" cy="21.8" r="7.5" fill="url(#cwDot)" filter="url(#cwGlow)"/>
</svg>
