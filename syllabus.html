<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('cw_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Syllabus | Curious Works</title>
<meta name="description" content="See the full class-by-class syllabus for any Curious Works course.">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .syllabus-not-found { text-align: center; padding: 40px 0; }
  .syllabus-class-list { display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
  .syllabus-class-item {
    display: flex;
    gap: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
  }
  .syllabus-class-num {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent-glow-soft);
    color: var(--accent-2);
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .syllabus-class-item.is-final .syllabus-class-num { background: var(--accent); color: var(--btn-primary-text); }
  .syllabus-class-body { flex: 1; }
  .syllabus-class-body h3 { font-size: 1.1rem; margin-bottom: 10px; }
  .syllabus-class-body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
  .syllabus-class-body li { font-size: 0.92rem; color: var(--text-dim); }
  .syllabus-actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 32px; }
</style>
</head>
<body data-page="syllabus">

<header class="site-header" id="site-header"></header>

<main>

  <section class="page-hero">
    <div class="container">
      <div class="eyebrow">Course Syllabus</div>
      <h1 id="syllabus-title">Loading course…</h1>
      <p id="syllabus-sub"></p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container" style="max-width: 800px;">

      <div id="syllabus-not-found" class="syllabus-not-found" style="display:none;">
        <p>We couldn't find that course. Browse the full catalog instead.</p>
        <a href="courses.html" class="btn btn-primary">View All Courses</a>
      </div>

      <div id="syllabus-content" style="display:none;">
        <div class="syllabus-class-list" id="syllabus-class-list"></div>

        <div class="syllabus-actions">
          <a href="#" id="syllabus-enroll-link" class="btn btn-primary">Enroll in This Course</a>
          <a href="courses.html" class="btn btn-secondary">Back to Courses</a>
        </div>
      </div>

    </div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/courses-data.js"></script>
<script src="js/syllabus-data.js"></script>
<script src="js/components.js"></script>
<script src="js/particles.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('course');
    const course = slug ? cwFindCourse(slug) : null;
    const classes = slug ? cwFindSyllabus(slug) : null;

    if (!course || !classes) {
      document.getElementById('syllabus-title').textContent = 'Course Not Found';
      document.getElementById('syllabus-sub').textContent = '';
      document.getElementById('syllabus-not-found').style.display = 'block';
      return;
    }

    document.title = course.title + ' Syllabus | Curious Works';
    document.getElementById('syllabus-title').textContent = course.title + ' Syllabus';
    document.getElementById('syllabus-sub').textContent =
      course.ageRange + ' · ' + course.level + ' · ' + course.duration + ' · 8 classes';

    const list = document.getElementById('syllabus-class-list');
    list.innerHTML = classes.map(function (c, i) {
      const isFinal = i === classes.length - 1;
      return (
        '<div class="syllabus-class-item' + (isFinal ? ' is-final' : '') + '">' +
          '<div class="syllabus-class-num">' + (isFinal ? '★' : (i + 1)) + '</div>' +
          '<div class="syllabus-class-body">' +
            '<h3>Class ' + (i + 1) + ': ' + c.title + '</h3>' +
            '<ul>' + c.topics.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    document.getElementById('syllabus-enroll-link').href = 'enroll.html?course=' + course.slug;
    document.getElementById('syllabus-content').style.display = 'block';
  });
</script>
</body>
</html>
